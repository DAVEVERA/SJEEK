<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" fill="none">
  <defs>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="face-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="100%" stop-color="#0f0720"/>
    </linearGradient>
    <linearGradient id="shaker-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="eye-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="60%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Ambient glow behind figure -->
  <ellipse cx="100" cy="200" rx="70" ry="20" fill="#6366f1" opacity="0.15"/>

  <!-- ─── LEGS ─── -->
  <rect x="80" y="195" width="16" height="55" rx="8" fill="url(#suit)"/>
  <rect x="104" y="195" width="16" height="55" rx="8" fill="url(#suit)"/>
  <!-- Shoe hints -->
  <ellipse cx="88" cy="250" rx="10" ry="5" fill="#1e1b4b"/>
  <ellipse cx="112" cy="250" rx="10" ry="5" fill="#1e1b4b"/>

  <!-- ─── BODY / SUIT ─── -->
  <rect x="68" y="130" width="64" height="70" rx="16" fill="url(#suit)"/>

  <!-- Suit lapels -->
  <polygon points="100,137 85,155 100,148" fill="#2d2060"/>
  <polygon points="100,137 115,155 100,148" fill="#2d2060"/>

  <!-- Bow tie -->
  <polygon points="94,137 100,143 106,137 100,141" fill="#ec4899" filter="url(#soft-glow)"/>
  <!-- Bow tie glow -->
  <polygon points="94,137 100,143 106,137 100,141" fill="none" stroke="#f9a8d4" stroke-width="0.5" opacity="0.8"/>

  <!-- Shirt buttons (circuit dots) -->
  <circle cx="100" cy="153" r="2" fill="#6366f1" filter="url(#neon-glow)"/>
  <circle cx="100" cy="162" r="2" fill="#6366f1" filter="url(#neon-glow)"/>
  <circle cx="100" cy="171" r="2" fill="#6366f1" filter="url(#neon-glow)"/>

  <!-- Circuit lines on suit -->
  <path d="M85 155 L75 165 L78 175" stroke="#6366f1" stroke-width="0.8" stroke-opacity="0.4" stroke-dasharray="2,2"/>
  <path d="M115 155 L125 165 L122 175" stroke="#ec4899" stroke-width="0.8" stroke-opacity="0.4" stroke-dasharray="2,2"/>

  <!-- ─── VEST / WAISTCOAT ─── -->
  <path d="M82,150 Q100,160 118,150 L118,195 Q100,200 82,195 Z" fill="#2d1b4e" opacity="0.5"/>

  <!-- ─── RIGHT ARM (holding shaker) ─── -->
  <rect x="132" y="130" width="14" height="50" rx="7" fill="url(#suit)"/>
  <rect x="130" y="130" width="14" height="50" rx="7" fill="url(#suit)" opacity="0.8"/>
  <!-- Forearm turn -->
  <rect x="136" y="155" width="30" height="12" rx="6" fill="url(#suit)"/>

  <!-- Cocktail shaker -->
  <rect x="158" y="125" width="22" height="55" rx="8" fill="url(#shaker-grad)"/>
  <rect x="160" y="123" width="18" height="10" rx="5" fill="#e0e7ff"/>
  <!-- Shaker shine -->
  <rect x="162" y="128" width="4" height="35" rx="2" fill="white" opacity="0.25"/>
  <!-- Shaker liquid motion lines -->
  <path d="M162 175 Q169 170 176 175" stroke="#6366f1" stroke-width="1" stroke-opacity="0.5" stroke-linecap="round"/>
  <path d="M162 180 Q169 175 176 180" stroke="#6366f1" stroke-width="1" stroke-opacity="0.4" stroke-linecap="round"/>
  <!-- Shaker sparkle -->
  <circle cx="178" cy="128" r="3" fill="#f9a8d4" filter="url(#neon-glow)" opacity="0.9"/>

  <!-- ─── LEFT ARM ─── -->
  <rect x="54" y="130" width="14" height="46" rx="7" fill="url(#suit)"/>

  <!-- ─── HEAD ─── -->
  <ellipse cx="100" cy="110" rx="30" ry="34" fill="url(#face-grad)"/>
  <!-- Head glow -->
  <ellipse cx="100" cy="110" rx="30" ry="34" stroke="url(#body)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- ─── FACE ─── -->
  <!-- Eyes — glowing cyan AI eyes -->
  <ellipse cx="88" cy="106" rx="7" ry="7" fill="url(#eye-glow)" filter="url(#neon-glow)"/>
  <ellipse cx="112" cy="106" rx="7" ry="7" fill="url(#eye-glow)" filter="url(#neon-glow)"/>
  <ellipse cx="88" cy="106" rx="3" ry="3" fill="#e0f2fe"/>
  <ellipse cx="112" cy="106" rx="3" ry="3" fill="#e0f2fe"/>
  <!-- Eye shine -->
  <circle cx="89.5" cy="104.5" r="1" fill="white" opacity="0.9"/>
  <circle cx="113.5" cy="104.5" r="1" fill="white" opacity="0.9"/>

  <!-- Mouth — subtle smile -->
  <path d="M91 120 Q100 127 109 120" stroke="#818cf8" stroke-width="2" stroke-linecap="round" fill="none" filter="url(#soft-glow)"/>

  <!-- Ear details (side panels) -->
  <ellipse cx="70" cy="110" rx="5" ry="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="0.8" stroke-opacity="0.5"/>
  <ellipse cx="130" cy="110" rx="5" ry="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="0.8" stroke-opacity="0.5"/>
  <!-- Ear circuit dots -->
  <circle cx="70" cy="107" r="1.5" fill="#06b6d4" filter="url(#neon-glow)"/>
  <circle cx="70" cy="113" r="1.5" fill="#06b6d4" filter="url(#neon-glow)"/>
  <circle cx="130" cy="107" r="1.5" fill="#ec4899" filter="url(#neon-glow)"/>
  <circle cx="130" cy="113" r="1.5" fill="#ec4899" filter="url(#neon-glow)"/>

  <!-- ─── HAIR / TOP ─── -->
  <!-- Slicked back style with gradient -->
  <ellipse cx="100" cy="80" rx="28" ry="14" fill="#0f0720"/>
  <path d="M72 84 Q100 68 128 84" fill="#1a0f35"/>
  <!-- Hair shine -->
  <path d="M82 76 Q100 70 114 78" stroke="url(#body)" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.4" fill="none"/>

  <!-- ─── POCKET SQUARE ─── -->
  <polygon points="74,138 80,136 78,145 74,143" fill="#f9a8d4" opacity="0.7"/>

  <!-- ─── AMBIENT PARTICLES ─── -->
  <circle cx="40" cy="80" r="2" fill="#ec4899" opacity="0.5" filter="url(#neon-glow)"/>
  <circle cx="160" cy="75" r="1.5" fill="#06b6d4" opacity="0.6" filter="url(#neon-glow)"/>
  <circle cx="170" cy="120" r="1" fill="#f9a8d4" opacity="0.7"/>
  <circle cx="30" cy="140" r="1.5" fill="#818cf8" opacity="0.5"/>
  <circle cx="172" cy="180" r="2" fill="#ec4899" opacity="0.4" filter="url(#neon-glow)"/>

  <!-- Sparkle droplets from shaker -->
  <circle cx="185" cy="118" r="2" fill="#f9a8d4" opacity="0.8" filter="url(#neon-glow)"/>
  <circle cx="190" cy="130" r="1.2" fill="#c7d2fe" opacity="0.7"/>
  <circle cx="183" cy="140" r="1.5" fill="#818cf8" opacity="0.6"/>
</svg>
