<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2d1b4e"/>
      <stop offset="100%" stop-color="#0d0718"/>
    </radialGradient>
    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="60" cy="60" r="60" fill="url(#bg)"/>

  <!-- Outer ring -->
  <circle cx="60" cy="60" r="56" stroke="url(#glass-grad)" stroke-width="0.5" stroke-opacity="0.4"/>

  <!-- Cocktail glass body (martini shape) -->
  <polygon points="60,38 82,62 38,62" fill="url(#glass-grad)" opacity="0.15" filter="url(#glow)"/>
  <polygon points="60,38 82,62 38,62" fill="none" stroke="url(#glass-grad)" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Liquid fill -->
  <polygon points="60,45 77,62 43,62" fill="url(#liquid)" opacity="0.5"/>

  <!-- Shine on glass -->
  <polygon points="60,38 68,53 64,53" fill="url(#shine)"/>

  <!-- Stem -->
  <line x1="60" y1="62" x2="60" y2="78" stroke="url(#glass-grad)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Base -->
  <line x1="50" y1="78" x2="70" y2="78" stroke="url(#glass-grad)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Garnish (olive/cherry on cocktail pick) -->
  <line x1="72" y1="38" x2="64" y2="46" stroke="#f9a8d4" stroke-width="1" stroke-linecap="round"/>
  <circle cx="73" cy="37" r="3" fill="#ec4899" filter="url(#glow)"/>
  <circle cx="73" cy="37" r="1.5" fill="#fda4af" opacity="0.6"/>

  <!-- Bubbles in liquid -->
  <circle cx="55" cy="57" r="1" fill="white" opacity="0.4"/>
  <circle cx="62" cy="54" r="0.8" fill="white" opacity="0.3"/>
  <circle cx="67" cy="58" r="0.6" fill="white" opacity="0.35"/>

  <!-- Star sparkles -->
  <g opacity="0.7" filter="url(#glow)">
    <circle cx="26" cy="28" r="1.5" fill="#f9a8d4"/>
    <circle cx="94" cy="32" r="1" fill="#818cf8"/>
    <circle cx="90" cy="88" r="1.5" fill="#f9a8d4"/>
    <circle cx="22" cy="84" r="1" fill="#818cf8"/>
    <circle cx="34" cy="50" r="0.8" fill="white"/>
    <circle cx="88" cy="55" r="0.8" fill="white"/>
  </g>
</svg>
